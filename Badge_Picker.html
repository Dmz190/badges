<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a Badge</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2C4A63;--clay:#B08968;--clay-lt:#E8DCCF;--clay-dk:#8A6A4F;--sand:#FBF9F5;--cream:#F3EEE5;--char:#4A4E54;--muted:#8A8579;--line:#E7E0D4;--green:#5A7D5A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#EAE4D8;color:var(--char);padding:24px;}
  .wrap{max-width:620px;margin:0 auto;}
  .head{background:var(--ink);color:#fff;padding:26px 30px;border-radius:14px 14px 0 0;border-bottom:3px solid var(--clay);}
  .head .tag{font-family:'Caveat',cursive;font-size:22px;color:var(--clay-lt);font-weight:600;}
  .head h1{font-size:22px;font-weight:700;margin-top:2px;}
  .body{background:var(--sand);border-radius:0 0 14px 14px;padding:26px 30px;box-shadow:0 10px 40px rgba(44,74,99,.12);}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;margin-top:4px;}
  select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;color:var(--char);background:#fff;margin-bottom:18px;}
  .who{background:var(--cream);border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:14px;color:var(--char);display:none;}
  .who b{color:var(--clay-dk);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  .badge{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;}
  .badge:hover{border-color:var(--clay);}
  .badge.sel{border-color:var(--green);background:#F3F7F3;box-shadow:0 4px 14px rgba(90,125,90,.2);}
  .badge .ic{width:48px;height:48px;background:var(--cream);border-radius:50%;padding:10px;margin:0 auto 8px;}
  .badge .ic svg{width:100%;height:100%;}
  .badge .t{font-size:14px;font-weight:700;color:var(--ink);}
  .badge .m{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .btn{width:100%;background:var(--ink);color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:600;padding:14px;border-radius:10px;cursor:pointer;}
  .btn:hover{background:var(--clay-dk);}
  .btn:disabled{background:var(--muted);cursor:not-allowed;}
  .result{display:none;background:#fff;border-radius:14px;padding:30px;text-align:center;box-shadow:0 10px 40px rgba(44,74,99,.15);margin-top:20px;}
  .result .rlogo{font-family:'Caveat',cursive;font-size:20px;color:var(--clay);font-weight:600;}
  .result .rfor{font-size:13px;color:var(--muted);margin-top:14px;}
  .result .rname{font-size:26px;font-weight:700;color:var(--ink);margin:4px 0 16px;}
  .result .ric{width:96px;height:96px;background:var(--cream);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;}
  .result .ric svg{width:54px;height:54px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.15));}
  .result .rbadge{font-size:22px;font-weight:700;color:var(--ink);}
  .result .rmean{font-size:13px;color:var(--muted);margin-top:6px;}
  .result .summary{margin-top:22px;padding:14px;background:var(--cream);border-radius:10px;font-family:monospace;font-size:15px;color:var(--clay-dk);font-weight:700;letter-spacing:.5px;}
  .result .hint{font-size:11px;color:var(--muted);margin-top:14px;font-style:italic;}
  .foot{text-align:center;font-size:9px;color:var(--muted);margin-top:16px;}
</style></head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tag">Graduation Badges</div>
    <h1>Choose a badge for your teammate</h1>
  </div>
  <div class="body" id="form">
    <div id="gate">
      <label>Enter your secret code</label>
      <input id="code" type="tel" maxlength="4" placeholder="4-digit code" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:16px;letter-spacing:4px;text-align:center;margin-bottom:12px;">
      <button class="btn" id="unlock">Unlock</button>
      <div id="err" style="display:none;color:#B0685A;font-size:13px;margin-top:10px;text-align:center;font-weight:600;">Wrong code - try again.</div>
    </div>
    <div class="who" id="whoBox" style="display:none;">Hi <b id="me"></b> - you are choosing a badge for <b id="teammate"></b>.</div>
    <div id="badgeArea" style="display:none;">
      <label>Pick the badge that best represents them:</label>
      <div class="grid" id="grid"></div>
      <button class="btn" id="submit" disabled>Submit my choice</button>
    </div>
  </div>
  <div class="result" id="result">
    <div class="rlogo">King's College Hospital London - Jeddah</div>
    <div class="rfor">A badge chosen for</div>
    <div class="rname" id="rname"></div>
    <div class="ric" id="ric"></div>
    <div class="rbadge" id="rbadge"></div>
    <div class="rmean" id="rmean"></div>
    <div class="summary" id="summary"></div>
    <div class="hint">Screenshot this and send it to your supervisor.</div>
  </div>
  <div class="foot">Designed &amp; Developed by Abdulrahman Al-Otaibi 23</div>
</div>
<script>
const BADGES=[{key:"eye",title:"The Sharp Eye",meaning:"Precision and spotting the details others miss",icon:`<defs><linearGradient id="g_eye" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#EE5A8C"/></linearGradient></defs>      <circle cx="42" cy="42" r="24" fill="none" stroke="url(#g_eye)" stroke-width="7"/><path d="M60 60 l22 22" stroke="url(#g_eye)" stroke-width="7" stroke-linecap="round"/><circle cx="42" cy="42" r="9" fill="url(#g_eye)"/>`},{key:"spark",title:"The Initiator",meaning:"Initiative and the courage to start",icon:`<defs><linearGradient id="g_spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB627"/><stop offset="1" stop-color="#FF6B35"/></linearGradient></defs>      <path d="M52 10 l-20 44 l16 0 l-8 36 l28 -50 l-16 0 l8 -30 z" fill="url(#g_spark)"/>`},{key:"riser",title:"The Riser",meaning:"Steady growth and constant improvement",icon:`<defs><linearGradient id="g_rise" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2ECC71"/><stop offset="1" stop-color="#16A085"/></linearGradient></defs>      <path d="M16 78 l22 -24 l16 14 l30 -38" fill="none" stroke="url(#g_rise)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 30 l20 0 l0 20" fill="none" stroke="url(#g_rise)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`},{key:"layers",title:"The Methodical",meaning:"Structure, order, and method",icon:`<defs><linearGradient id="g_lay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A66BFF"/><stop offset="1" stop-color="#6C5CE7"/></linearGradient></defs>      <path d="M50 14 l34 17 l-34 17 l-34 -17 z" fill="url(#g_lay)"/>      <path d="M18 49 l32 16 l32 -16" fill="none" stroke="url(#g_lay)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>      <path d="M18 66 l32 16 l32 -16" fill="none" stroke="url(#g_lay)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`},{key:"connect",title:"The Connector",meaning:"Linking ideas to the real world",icon:`<defs><linearGradient id="g_con" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0FF"/><stop offset="1" stop-color="#0088CC"/></linearGradient></defs>      <path d="M34 34 l12 30 M66 34 l-12 30 M42 30 l16 0" stroke="url(#g_con)" stroke-width="5"/>      <circle cx="30" cy="30" r="11" fill="url(#g_con)"/><circle cx="70" cy="30" r="11" fill="url(#g_con)"/><circle cx="50" cy="72" r="11" fill="url(#g_con)"/>`},{key:"compass",title:"The Navigator",meaning:"Clarity and setting the direction",icon:`<defs><linearGradient id="g_comp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A8B"/><stop offset="1" stop-color="#FF5E7E"/></linearGradient></defs>      <circle cx="50" cy="50" r="34" fill="none" stroke="url(#g_comp)" stroke-width="7"/><path d="M50 28 l9 22 l-9 22 l-9 -22 z" fill="url(#g_comp)"/><circle cx="50" cy="50" r="4" fill="#fff"/>`},{key:"grow",title:"The Grower",meaning:"Quiet effort and patience",icon:`<defs><linearGradient id="g_grow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#43E97B"/><stop offset="1" stop-color="#38F9D7"/></linearGradient></defs>      <path d="M50 84 l0 -32" stroke="url(#g_grow)" stroke-width="7" stroke-linecap="round"/>      <path d="M50 56 q-22 -2 -26 -26 q24 -2 26 22z" fill="url(#g_grow)"/><path d="M50 50 q20 -4 24 -24 q-20 0 -24 20z" fill="url(#g_grow)"/>`},{key:"bulb",title:"The Thinker",meaning:"Deep analysis and the big idea",icon:`<defs><linearGradient id="g_bulb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE259"/><stop offset="1" stop-color="#FFA751"/></linearGradient></defs>      <path d="M50 14 q-22 0 -22 22 q0 13 11 22 l0 8 l22 0 l0 -8 q11 -9 11 -22 q0 -22 -22 -22z" fill="url(#g_bulb)"/>      <path d="M40 74 l20 0 M43 82 l14 0" stroke="#FF9A00" stroke-width="5" stroke-linecap="round"/>`}];
const CODES={"2951": {"picker": "Shahad", "teammate": "Maya"}, "6234": {"picker": "Maya", "teammate": "Liyan"}, "9233": {"picker": "Liyan", "teammate": "Lama"}, "9385": {"picker": "Lama", "teammate": "Camelia"}, "2681": {"picker": "Camelia", "teammate": "Shahad"}};
const GUESTS={"7777":{name:"Fatima",titleEn:"The Committed Star",titleAr:"الرهيبة الملتزمة"}};
const PAIRS=[{picker:"Shahad",teammate:"Maya"},{picker:"Maya",teammate:"Liyan"},{picker:"Liyan",teammate:"Lama"},{picker:"Lama",teammate:"Camelia"},{picker:"Camelia",teammate:"Shahad"}];
let selected=null;
const grid=document.getElementById('grid');
BADGES.forEach(b=>{
  const d=document.createElement('div');d.className='badge';d.dataset.key=b.key;
  d.innerHTML=`<div class="ic"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">${b.icon}</svg></div><div class="t">${b.title}</div><div class="m">${b.meaning}</div>`;
  d.onclick=()=>{document.querySelectorAll('.badge').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');selected=b;document.getElementById('submit').disabled=false;};
  grid.appendChild(d);
});
let teammate="";
document.getElementById('unlock').onclick=()=>{
  const val=document.getElementById('code').value.trim();
  const guest=GUESTS[val];
  if(guest){
    document.getElementById('form').style.display='none';
    const r=document.getElementById('result');
    r.innerHTML=`
      <div class="rlogo">King's College Hospital London - Jeddah</div>
      <div style="margin-top:20px;font-family:'Caveat',cursive;font-size:30px;color:#B08968;font-weight:700;">Thank You, ${guest.name} 💙</div>
      <div class="ric" id="gic" style="margin-top:16px;"></div>
      <div class="rbadge" style="margin-top:8px;">${guest.titleEn}</div>
      <div class="rmean" style="direction:rtl;">${guest.titleAr}</div>
      <div style="margin-top:20px;padding:18px 20px;background:var(--cream);border-radius:10px;font-size:13.5px;color:var(--char);line-height:1.9;">
        With sincere appreciation for your commitment and the wonderful energy you brought to the team. You were a remarkable presence, and this is a small token of our gratitude.
        <div style="direction:rtl;margin-top:10px;color:var(--clay-dk);font-weight:600;">شكراً لك على التزامك وحضورك المميز مع الفريق. كنتِ إضافة رائعة، وهذا تقدير بسيط لك.</div>
      </div>
      <div class="hint" style="margin-top:14px;">Screenshot this and keep it 💙</div>`;
    // gold star icon
    document.getElementById('gic').innerHTML='<svg viewBox="0 0 100 100" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE259"/><stop offset="1" stop-color="#F5B301"/></linearGradient></defs><path d="M50 8 l12 26 l28 3 l-21 19 l6 28 l-25 -14 l-25 14 l6 -28 l-21 -19 l28 -3 z" fill="url(#g_gold)"/></svg>';
    r.style.display='block';
    return;
  }
  const rec=CODES[val];
  if(rec){
    teammate=rec.teammate;
    document.getElementById('me').textContent=rec.picker;
    document.getElementById('teammate').textContent=teammate;
    document.getElementById('gate').style.display='none';
    document.getElementById('whoBox').style.display='block';
    document.getElementById('badgeArea').style.display='block';
  }else{
    document.getElementById('err').style.display='block';
  }
};
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlock').click();});
document.getElementById('submit').onclick=()=>{
  if(!selected)return;
  document.getElementById('form').style.display='none';
  document.getElementById('rname').textContent=teammate;
  let iconHtml=selected.icon.replace(/g_([a-z]+)/g,'g_$1_r');
  document.getElementById('ric').innerHTML=`<svg viewBox="0 0 100 100" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">${iconHtml}</svg>`;
  document.getElementById('rbadge').textContent=selected.title;
  document.getElementById('rmean').textContent=selected.meaning;
  document.getElementById('summary').textContent=`${teammate} = ${selected.title}`;
  document.getElementById('result').style.display='block';
};
</script>
</body></html>
