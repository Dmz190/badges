<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جسر الحرير — وساطة إنتاج التسويق</title>
<meta name="description" content="جسر الحرير — وسيطك في إنتاج التسويق والفعاليات: اطلب، استلم عرض سعر مفصّل، ونتابع التنفيذ مع الموردين حتى التسليم.">
<meta name="theme-color" content="#0A0D12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   جسر الحرير — Silk Bridge  |  واجهة داكنة فاخرة، RTL
   ========================================================================== */

:root{
  --bg:#0A0D12;
  --bg-2:#0E1219;
  --panel:#131924;
  --panel-2:#182031;
  --line:#232C3D;
  --line-2:#2E394D;
  --ink:#EDF1F7;
  --muted:#93A1B8;
  --muted-2:#66748C;
  --gold:#C9A96A;
  --gold-2:#E3C88C;
  --gold-dim:rgba(201,169,106,.12);
  --teal:#5FA8A0;
  --green:#4FA96B;
  --red:#D9636B;
  --amber:#D9A441;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(201,169,106,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(95,168,160,.07), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:14px}
::selection{background:var(--gold);color:#0A0D12}

/* ---------- تخطيط عام ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.wrap-narrow{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- الشريط العلوي ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(10,13,18,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .inner{display:flex;align-items:center;gap:22px;height:66px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px}
.brand .mark{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:linear-gradient(140deg,var(--gold),#8A6E3C);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(201,169,106,.28);
}
.brand .mark svg{width:20px;height:20px}
.brand .t1{font-size:16px;line-height:1.2}
.brand .t2{font-size:10.5px;color:var(--muted-2);letter-spacing:2px;text-transform:uppercase;line-height:1.2}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nav a{
  padding:8px 14px;border-radius:9px;font-size:13.5px;color:var(--muted);
  border:1px solid transparent;transition:.15s;
}
.nav a:hover{color:var(--ink);background:var(--panel)}
.nav a.on{color:var(--gold-2);background:var(--gold-dim);border-color:rgba(201,169,106,.25)}

/* ---------- الأزرار ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--ink);cursor:pointer;
  font-weight:600;font-size:14px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--muted-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-gold{
  background:linear-gradient(140deg,var(--gold-2),var(--gold));
  color:#14100A;border-color:transparent;
  box-shadow:0 10px 26px rgba(201,169,106,.24);
}
.btn-gold:hover{box-shadow:0 14px 32px rgba(201,169,106,.34)}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
.btn-danger{color:var(--red);border-color:rgba(217,99,107,.35)}
.btn-danger:hover{background:rgba(217,99,107,.10)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- الواجهة العامة (Landing) ---------- */
.hero{padding:84px 0 70px;position:relative;overflow:hidden}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12px;letter-spacing:1.4px;color:var(--gold-2);
  background:var(--gold-dim);border:1px solid rgba(201,169,106,.24);
  padding:6px 14px;border-radius:99px;margin-bottom:22px;
}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.25;font-weight:700;letter-spacing:-.5px}
.hero h1 span{
  background:linear-gradient(120deg,var(--gold-2),var(--gold),#9A7C46);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p.lead{font-size:17px;color:var(--muted);max-width:640px;margin-top:18px}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .stats{display:flex;gap:38px;margin-top:52px;flex-wrap:wrap}
.hero .stats .s .n{font-size:26px;font-weight:700;color:var(--gold-2)}
.hero .stats .s .l{font-size:12.5px;color:var(--muted-2)}

.section{padding:58px 0;border-top:1px solid var(--line)}
.section h2{font-size:24px;margin-bottom:8px}
.section .sub{color:var(--muted);font-size:14.5px;margin-bottom:30px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.card{
  background:linear-gradient(160deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:22px;
  transition:.18s;
}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.card .ic{
  width:42px;height:42px;border-radius:11px;background:var(--gold-dim);
  border:1px solid rgba(201,169,106,.2);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:19px;
}
.card h3{font-size:15.5px;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--muted);line-height:1.65}
.card .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11.5px;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--line);border-radius:99px;padding:3px 10px;
}

.steps{counter-reset:st}
.step{position:relative;padding-inline-start:56px;margin-bottom:26px}
.step:before{
  counter-increment:st;content:counter(st);
  position:absolute;inset-inline-start:0;top:0;
  width:38px;height:38px;border-radius:11px;
  background:var(--gold-dim);border:1px solid rgba(201,169,106,.28);
  color:var(--gold-2);font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.step h4{font-size:15px;margin-bottom:3px}
.step p{font-size:13.5px;color:var(--muted)}

/* ---------- النماذج ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field label .req{color:var(--gold)}
.inp,select.inp,textarea.inp{
  width:100%;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
  transition:.15s;
}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,106,.12)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.7}
select.inp{cursor:pointer}
.inp::placeholder{color:var(--muted-2)}
.hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.row{display:grid;gap:14px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:1fr 1fr 1fr}
.r4{grid-template-columns:repeat(4,1fr)}

.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;
}
.panel + .panel{margin-top:18px}
.panel h3{font-size:16px;margin-bottom:4px}
.panel .psub{font-size:13px;color:var(--muted);margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel-head h3{margin:0}
.panel-head .spacer{margin-inline-start:auto}

/* ---------- الجداول ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
thead th{
  background:var(--panel-2);color:var(--muted);font-weight:600;font-size:12px;
  text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.018)}
td .cell-inp{
  width:100%;background:transparent;border:1px solid transparent;
  border-radius:7px;padding:7px 8px;color:var(--ink);
}
td .cell-inp:hover{border-color:var(--line)}
td .cell-inp:focus{outline:none;background:var(--bg-2);border-color:var(--gold)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.w-sm{width:104px}.w-md{width:132px}.w-xs{width:86px}
table.wide{min-width:1360px}
table.wide td:first-child,table.wide th:first-child{min-width:200px}
table.wide td:nth-child(2){min-width:150px}
td .cell-inp[type=number]{text-align:start}

/* ---------- الحالات والشارات ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap;
}
.b-new{color:var(--teal);border-color:rgba(95,168,160,.35);background:rgba(95,168,160,.10)}
.b-work{color:var(--amber);border-color:rgba(217,164,65,.35);background:rgba(217,164,65,.10)}
.b-sent{color:var(--gold-2);border-color:rgba(201,169,106,.35);background:var(--gold-dim)}
.b-won{color:var(--green);border-color:rgba(79,169,107,.35);background:rgba(79,169,107,.10)}
.b-lost{color:var(--red);border-color:rgba(217,99,107,.35);background:rgba(217,99,107,.10)}
.b-mute{color:var(--muted);border-color:var(--line);background:var(--panel-2)}

/* ---------- مساحة العمل ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{
  background:linear-gradient(160deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
}
.kpi .l{font-size:12px;color:var(--muted-2)}
.kpi .n{font-size:23px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .n.gold{color:var(--gold-2)}
.kpi .n.green{color:var(--green)}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:12px 16px;font-size:14px;font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold-2);border-bottom-color:var(--gold)}

.totals{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;
}
.totals .t-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.totals .t-row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.totals .t-row.muted{color:var(--muted);font-size:13px}
.totals .t-row.grand{
  border-top:1px solid var(--line);margin-top:10px;padding-top:14px;
  font-size:18px;font-weight:700;color:var(--gold-2);
}
.totals .t-row.profit span:last-child{color:var(--green)}

.empty{text-align:center;padding:56px 20px;color:var(--muted-2)}
.empty .e-ic{font-size:34px;margin-bottom:10px;opacity:.5}

.list-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg-2);margin-bottom:10px;transition:.15s;flex-wrap:wrap;
}
.list-item:hover{border-color:var(--line-2)}
.list-item .li-main{flex:1;min-width:200px}
.list-item .li-t{font-weight:600;font-size:14.5px}
.list-item .li-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.list-item .li-n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold-2);white-space:nowrap}

/* ---------- القفل ---------- */
.lock{max-width:400px;margin:70px auto;text-align:center}
.lock .lk-ic{font-size:36px;margin-bottom:14px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:26px;inset-inline-start:26px;z-index:200;
  display:flex;flex-direction:column;gap:10px;
}
.toast{
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);
  padding:12px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);
  font-size:13.5px;animation:tin .25s ease-out;
}
.toast.ok{border-inline-start:3px solid var(--green)}
.toast.err{border-inline-start:3px solid var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(4px);
  z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:26px;max-width:560px;width:100%;box-shadow:var(--shadow);
  max-height:88vh;overflow:auto;
}
.modal h3{font-size:17px;margin-bottom:16px}

/* ---------- التذييل ---------- */
footer.site{
  border-top:1px solid var(--line);margin-top:60px;padding:34px 0;
  color:var(--muted-2);font-size:12.5px;
}
footer.site .inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- مستند الطباعة ---------- */
#printDoc{display:none}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#111}
  .topbar,footer.site,#view,#toast,.modal-bg{display:none !important}
  #printDoc{display:block;font-size:12px;color:#111}
  #printDoc .p-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid #C9A96A;padding-bottom:12px;margin-bottom:18px}
  #printDoc .p-brand{font-size:20px;font-weight:700;color:#1A1A1A}
  #printDoc .p-brand small{display:block;font-size:10px;color:#777;letter-spacing:2px}
  #printDoc .p-meta{text-align:end;font-size:11px;color:#444;line-height:1.8}
  #printDoc h2{font-size:14px;margin:16px 0 8px;color:#1A1A1A}
  #printDoc table{width:100%;border-collapse:collapse;font-size:11px;min-width:0}
  #printDoc th{background:#F4F1EA;color:#333;border:1px solid #DDD6C6;padding:7px;text-align:start}
  #printDoc td{border:1px solid #E6E1D6;padding:6px 7px;color:#222}
  #printDoc td.num{text-align:end}
  #printDoc .p-tot{margin-top:14px;margin-inline-start:auto;width:56%}
  #printDoc .p-tot .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #EEE}
  #printDoc .p-tot .r.g{font-size:14px;font-weight:700;border-bottom:none;border-top:2px solid #C9A96A;margin-top:6px;padding-top:9px}
  #printDoc .p-terms{margin-top:22px;font-size:10.5px;color:#555;line-height:1.9;
    border-top:1px solid #E6E1D6;padding-top:12px;white-space:pre-line}
  #printDoc .p-sign{margin-top:34px;display:flex;justify-content:space-between;font-size:11px;color:#444}
}

/* ---------- الاستجابة ---------- */
@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .r4{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .r2,.r3,.r4{grid-template-columns:1fr}
  .topbar .inner{height:auto;padding:12px 0;flex-wrap:wrap}
  .nav{width:100%;margin-inline-start:0}
  .hero{padding:52px 0 42px}
  .hero .stats{gap:24px}
  .panel{padding:18px}
}

</style>

<body>

<header class="topbar">
  <div class="wrap inner">
    <a class="brand" href="#/">
      <span class="mark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M4 22c5-9 19-9 24 0" stroke="#14100A" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M10 22v-5M16 22v-7M22 22v-5" stroke="#14100A" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span>
        <span class="t1" id="brandAr">جسر الحرير</span>
        <span class="t2" id="brandEn">SILK BRIDGE</span>
      </span>
    </a>
    <nav class="nav">
      <a href="#/">الرئيسية</a>
      <a href="#/services">الخدمات</a>
      <a href="#/request">اطلب عرض سعر</a>
      <a href="#/app">مساحة العمل</a>
    </nav>
  </div>
</header>

<main id="view"></main>

<footer class="site">
  <div class="wrap inner">
    <div id="footBrand">جسر الحرير · SILK BRIDGE</div>
    <div>وساطة إنتاج التسويق والفعاليات — البيانات محفوظة في متصفحك.</div>
  </div>
</footer>

<div id="toast"></div>
<div id="printDoc"></div>

<script>
/* ==========================================================================
   جسر الحرير — البيانات الافتراضية (الهوية، الخدمات، كتالوج الأصناف)
   عدّل الأسعار من داخل الموقع: مساحة العمل ← الأصناف
   ========================================================================== */

const DEFAULT_SETTINGS = {
  brandAr: 'جسر الحرير',
  brandEn: 'SILK BRIDGE',
  tagline: 'وسيطك في إنتاج التسويق — من الفكرة إلى التسليم',
  owner: '',
  phone: '',
  email: '',
  city: 'الرياض',
  vatNo: '',
  crNo: '',
  vatRate: 15,          // نسبة ضريبة القيمة المضافة %
  defaultMargin: 20,    // هامش الوساطة الافتراضي على كل بند %
  serviceFeeType: 'pct',// pct | fixed
  serviceFeeValue: 0,   // رسوم إدارة المشروع
  validityDays: 14,     // صلاحية العرض بالأيام
  passcode: '1234',     // رمز الدخول لمساحة العمل (غيّره من الإعدادات)
  terms: 'الأسعار بالريال السعودي وشاملة أعمال التنسيق والمتابعة مع الموردين.\nمدة التنفيذ تبدأ من تاريخ اعتماد العرض واستلام المواد النهائية (ملفات التصميم).\nشروط الدفع: 50% دفعة مقدمة عند الاعتماد، و50% عند التسليم.\nأي تعديل على المواصفات أو الكميات بعد الاعتماد يُعاد تسعيره.\nالعرض ساري خلال المدة الموضحة أعلاه.',
  seq: { quote: 1, request: 1, po: 1 }
};

/* أقسام الخدمات — تظهر في الصفحة الرئيسية ونموذج الطلب */
const CATEGORIES = [

<script>
/* ==========================================================================
   جسر الحرير — طبقة التخزين والأدوات المساعدة
   كل البيانات تُحفظ في متصفحك (localStorage). لا يوجد سيرفر ولا حساب.
   ========================================================================== */

const KEY = 'silkbridge.v1.';

const DB = {
  read(name, fallback){
    try{
      const raw = localStorage.getItem(KEY + name);
      return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(fallback));
    }catch(e){
      console.warn('read failed', name, e);
      return JSON.parse(JSON.stringify(fallback));
    }
  },
  write(name, value){
    try{
      localStorage.setItem(KEY + name, JSON.stringify(value));
      return true;
    }catch(e){
      toast('تعذّر الحفظ — قد تكون مساحة المتصفح ممتلئة أو الحفظ معطّل', 'err');
      return false;
    }
  },
  drop(name){ try{ localStorage.removeItem(KEY + name); }catch(e){} }
};

/* ---------- الإعدادات ---------- */
function getSettings(){
  const s = DB.read('settings', {});
  const merged = Object.assign({}, DEFAULT_SETTINGS, s);
  merged.seq = Object.assign({}, DEFAULT_SETTINGS.seq, s.seq || {});
  return merged;
}
function saveSettings(s){ DB.write('settings', s); }

/* ---------- المجموعات ---------- */
function getItems(){
  let items = DB.read('items', null);
  if(!items){
    items = SEED_ITEMS.map((it, i) => Object.assign({id:'it' + (i+1)}, it));
    DB.write('items', items);
  }
  return items;
}
function saveItems(v){ DB.write('items', v); }

const getRequests = () => DB.read('requests', []);
const saveRequests = v => DB.write('requests', v);
const getQuotes   = () => DB.read('quotes', []);
const saveQuotes  = v => DB.write('quotes', v);
const getPOs      = () => DB.read('pos', []);
const savePOs     = v => DB.write('pos', v);
const getSuppliers= () => DB.read('suppliers', []);
const saveSuppliers = v => DB.write('suppliers', v);

/* ---------- المعرّفات ---------- */
function uid(prefix){
  return (prefix || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function nextRef(kind, prefix){
  const s = getSettings();
  const n = s.seq[kind] || 1;
  s.seq[kind] = n + 1;
  saveSettings(s);
  const d = new Date();
  const ym = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0');
  return prefix + '-' + ym + '-' + String(n).padStart(3, '0');
}

/* ---------- أرقام وتنسيق ---------- */
const num = v => { const n = parseFloat(String(v).replace(/[^\d.\-]/g, '')); return isNaN(n) ? 0 : n; };
const r2  = v => Math.round((v + Number.EPSILON) * 100) / 100;

function money(v, withCur){
  const n = r2(num(v));
  const s = n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return withCur === false ? s : s + ' ر.س';
}
function fmtInt(v){ return Math.round(num(v)).toLocaleString('en-US'); }

function today(){ return new Date().toISOString().slice(0, 10); }
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + num(days));
  return d.toISOString().slice(0, 10);
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

/* ---------- HTML آمن ---------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ---------- حساب العرض ---------- */
function calcQuote(q){
  const st = getSettings();
  let cost = 0, sell = 0;
  const lines = (q.lines || []).map(l => {
    const qty = num(l.qty), c = num(l.cost), m = num(l.margin);
    const unitPrice = r2(c * (1 + m / 100));
    const lineCost  = r2(c * qty);
    const lineTotal = r2(unitPrice * qty);
    cost += lineCost; sell += lineTotal;
    return Object.assign({}, l, {unitPrice, lineCost, lineTotal});
  });
  cost = r2(cost); sell = r2(sell);

  const fee = q.feeType === 'pct' ? r2(sell * num(q.feeValue) / 100) : r2(num(q.feeValue));
  const delivery = r2(num(q.delivery));
  const beforeDisc = r2(sell + fee + delivery);
  const discount = q.discType === 'pct' ? r2(beforeDisc * num(q.discValue) / 100) : r2(num(q.discValue));
  const subtotal = r2(beforeDisc - discount);
  const vatRate = q.vat === false ? 0 : num(st.vatRate);
  const vat = r2(subtotal * vatRate / 100);
  const total = r2(subtotal + vat);
  const profit = r2(subtotal - cost);
  const marginPct = subtotal > 0 ? r2(profit / subtotal * 100) : 0;

  return {lines, cost, sell, fee, delivery, discount, subtotal, vatRate, vat, total, profit, marginPct};
}

function emptyQuote(){
  const st = getSettings();
  return {
    id: uid('q'),
    ref: '',
    date: today(),
    validity: st.validityDays,
    status: 'draft',
    requestId: '',
    client: {name:'', org:'', phone:'', email:'', city:''},
    title: '',
    lines: [],
    feeType: st.serviceFeeType,
    feeValue: st.serviceFeeValue,
    delivery: 0,
    discType: 'fixed',
    discValue: 0,
    vat: true,
    notes: '',
    terms: st.terms,
    createdAt: new Date().toISOString()
  };
}
function emptyLine(){
  return {id: uid('l'), name:'', spec:'', qty:1, unit:'حبة', cost:0, margin:getSettings().defaultMargin, supplier:''};
}

/* ---------- نسخة احتياطية ---------- */
function exportAll(){
  return {
    app:'silk-bridge', version:1, exportedAt:new Date().toISOString(),
    settings:getSettings(), items:getItems(), suppliers:getSuppliers(),
    requests:getRequests(), quotes:getQuotes(), pos:getPOs()
  };
}
function importAll(data){
  if(!data || data.app !== 'silk-bridge') throw new Error('الملف غير متوافق');
  if(data.settings)  saveSettings(Object.assign({}, DEFAULT_SETTINGS, data.settings));
  if(data.items)     saveItems(data.items);
  if(data.suppliers) saveSuppliers(data.suppliers);
  if(data.requests)  saveRequests(data.requests);
  if(data.quotes)    saveQuotes(data.quotes);
  if(data.pos)       savePOs(data.pos);
}
function downloadFile(filename, content, type){
  const blob = new Blob([content], {type: type || 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function copyText(txt){
  const done = () => toast('تم النسخ ✓', 'ok');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  }else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('تعذّر النسخ', 'err'); }
  ta.remove();
}

/* ---------- تنبيهات ونوافذ ---------- */
function toast(msg, kind){
  const box = document.getElementById('toast');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2800);
}
function modal(title, bodyHTML, onMount){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modalBg';
  bg.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3>' + bodyHTML + '</div>';
  bg.addEventListener('click', e => { if(e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  if(onMount) onMount(bg);
}
function closeModal(){ const m = document.getElementById('modalBg'); if(m) m.remove(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

</script>

      <h2>الخدمات</h2>
      <div class="sub">كل اللي تحتاجه في إنتاج التسويق والفعاليات.</div>
      <div class="grid g4">${cats}</div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2>كيف نشتغل</h2>
      <div class="sub">أربع خطوات، بدون تعقيد.</div>
      <div class="grid g2">
        <div class="steps">
          <div class="step"><h4>ترسل طلبك</h4><p>تعبّي النموذج أو ترسل لنا رسالة بالمطلوب والكميات والموعد.</p></div>
          <div class="step"><h4>نسعّر ونقارن</h4><p>نطلب أسعار من موردين معتمدين ونختار الأنسب سعراً وجودة.</p></div>
        </div>
        <div class="steps" style="counter-reset:st 2">
          <div class="step"><h4>تعتمد العرض</h4><p>يوصلك عرض سعر مفصّل بالأسعار والمدة والشروط، تعتمده وندخل التنفيذ.</p></div>
          <div class="step"><h4>ننفّذ ونسلّم</h4><p>نتابع الإنتاج والتركيب والتوصيل، ونسلّمك جاهز في الموعد.</p></div>
        </div>
      </div>
      <div class="cta" style="margin-top:34px">
        <a class="btn btn-gold" href="#/request">ابدأ طلبك الآن</a>
      </div>
    </div>
  </section>`;
}

function viewServices(){
  const rows = CATEGORIES.map(c => {
    const items = getItems().filter(i => i.cat === c.id);
    return `
    <div class="panel">
      <div class="panel-head">
        <div class="ic" style="width:38px;height:38px;border-radius:10px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center">${c.icon}</div>
        <div><h3>${esc(c.name)}</h3><div style="font-size:13px;color:var(--muted)">${esc(c.desc)}</div></div>
        <div class="spacer"></div>
        <a class="btn btn-sm" href="#/request">اطلب من هذا القسم</a>
      </div>
      <div class="grid g3">
        ${items.map(i => `<div class="list-item"><div class="li-main"><div class="li-t">${esc(i.name)}</div><div class="li-s">الوحدة: ${esc(i.unit)} · مدة التنفيذ ~${esc(i.lead)} يوم</div></div></div>`).join('') || '<div class="hint">لا توجد أصناف مسجلة بعد في هذا القسم.</div>'}
      </div>
    </div>`;
  }).join('');
  return `<section class="section" style="border:none"><div class="wrap">
    <h2>دليل الخدمات</h2>
    <div class="sub">الأصناف المتوفرة حسب القسم. الأسعار تُحدد حسب الكمية والمواصفات في عرض السعر.</div>
    ${rows}
  </div></section>`;
}

/* ==========================================================================
   نموذج طلب عرض سعر
   ========================================================================== */
let REQ_LINES = [{id:uid('rl'), name:'', qty:1, unit:'حبة', spec:''}];

function reqLineRow(l){
  return `
  <tr data-rl="${l.id}">
    <td><input class="cell-inp" data-input="reqEdit" data-f="name" value="${esc(l.name)}" placeholder="مثال: رول أب 80×200"></td>
    <td class="w-sm"><input class="cell-inp" type="number" min="1" data-input="reqEdit" data-f="qty" value="${esc(l.qty)}"></td>
    <td class="w-md"><select class="cell-inp" data-change="reqEdit" data-f="unit">${UNITS.map(u => `<option ${u === l.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></td>
    <td><input class="cell-inp" data-input="reqEdit" data-f="spec" value="${esc(l.spec)}" placeholder="المقاس، الخامة، الألوان…"></td>
    <td class="w-xs"><button class="btn btn-sm btn-danger" data-act="reqDel" data-id="${l.id}">حذف</button></td>
  </tr>`;
}

function viewRequest(){
  const st = getSettings();
  return `
  <section class="section" style="border:none">
    <div class="wrap-narrow">
      <h2>طلب عرض سعر</h2>
      <div class="sub">عبّي المطلوب ونرجع لك بعرض سعر مفصّل. كل الحقول اللي عليها <span style="color:var(--gold)">*</span> مطلوبة.</div>

      <form data-submit="reqSubmit">
        <div class="panel">
          <h3>بيانات مقدّم الطلب</h3>
          <div class="psub">عشان نقدر نتواصل معك ونرسل العرض.</div>
          <div class="row r2">
            <div class="field"><label>الاسم <span class="req">*</span></label><input class="inp" name="name" required placeholder="الاسم الكامل"></div>
            <div class="field"><label>الجهة / الشركة</label><input class="inp" name="org" placeholder="اسم الشركة أو الجهة"></div>
          </div>
          <div class="row r3">
            <div class="field"><label>الجوال <span class="req">*</span></label><input class="inp" name="phone" required inputmode="tel" placeholder="05xxxxxxxx"></div>
            <div class="field"><label>البريد الإلكتروني</label><input class="inp" name="email" type="email" placeholder="name@company.com"></div>
            <div class="field"><label>المدينة</label><input class="inp" name="city" value="${esc(st.city)}"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div><h3>تفاصيل المطلوب</h3><div style="font-size:13px;color:var(--muted)">أضف كل صنف في سطر مستقل.</div></div>
            <div class="spacer"></div>
            <button type="button" class="btn btn-sm" data-act="reqAddFromCat">اختر من الكتالوج</button>
            <button type="button" class="btn btn-sm" data-act="reqAdd">+ سطر جديد</button>
          </div>
          <div class="field"><label>عنوان الطلب / المناسبة</label><input class="inp" name="title" placeholder="مثال: مستلزمات جناح معرض الصحة ٢٠٢٦"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>الصنف / الخدمة</th><th>الكمية</th><th>الوحدة</th><th>المواصفات</th><th></th></tr></thead>
              <tbody id="reqLines">${REQ_LINES.map(reqLineRow).join('')}</tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h3>الموعد والميزانية</h3>
          <div class="psub">تساعدنا نرشّح لك الخيار المناسب.</div>
          <div class="row r3">
            <div class="field"><label>تاريخ التسليم المطلوب</label><input class="inp" name="due" type="date"></div>
            <div class="field"><label>الميزانية التقريبية (ر.س)</label><input class="inp" name="budget" type="number" min="0" placeholder="اختياري"></div>
            <div class="field"><label>درجة الاستعجال</label>
              <select class="inp" name="urgency"><option>عادي</option><option>مستعجل</option><option>عاجل جداً</option></select>
            </div>
          </div>
          <div class="field"><label>ملاحظات إضافية</label><textarea class="inp" name="notes" placeholder="روابط ملفات التصميم، تفاصيل المكان، أي شيء يهمنا نعرفه…"></textarea></div>
          <div class="btn-row" style="margin-top:6px">
            <button class="btn btn-gold" type="submit">إرسال الطلب</button>
            <a class="btn btn-ghost" href="#/">إلغاء</a>
          </div>
          <div class="hint">الطلب يُحفظ في هذا الجهاز وتقدر ترسله لنا مباشرة عبر واتساب أو البريد بعد الإرسال.</div>
        </div>
      </form>
    </div>
  </section>`;
}

ACTIONS.reqAdd = () => {
  REQ_LINES.push({id:uid('rl'), name:'', qty:1, unit:'حبة', spec:''});
  document.getElementById('reqLines').innerHTML = REQ_LINES.map(reqLineRow).join('');
};
ACTIONS.reqDel = el => {
  if(REQ_LINES.length === 1) return toast('لازم يكون فيه سطر واحد على الأقل');
  REQ_LINES = REQ_LINES.filter(l => l.id !== el.dataset.id);
  document.getElementById('reqLines').innerHTML = REQ_LINES.map(reqLineRow).join('');
};
ACTIONS.reqEdit = el => {
  const id = el.closest('[data-rl]').dataset.rl;
  const l = REQ_LINES.find(x => x.id === id);
  if(l) l[el.dataset.f] = el.value;
};
ACTIONS.reqAddFromCat = () => {
  const items = getItems();
  const body = `
    <div class="field"><label>ابحث في الكتالوج</label>
      <input class="inp" id="catSearch" placeholder="اكتب اسم الصنف…"></div>
    <div id="catResults" style="max-height:320px;overflow:auto"></div>
    <div class="btn-row" style="margin-top:16px"><button class="btn" data-act="closeModal">إغلاق</button></div>`;
  modal('اختر من الكتالوج', body, bg => {
    const draw = q => {
      const list = items.filter(i => !q || i.name.includes(q));
      bg.querySelector('#catResults').innerHTML = list.map(i => `
        <div class="list-item">
          <div class="li-main"><div class="li-t">${esc(i.name)}</div>
            <div class="li-s">${esc((CATEGORIES.find(c => c.id === i.cat) || {}).name || '')} · ${esc(i.unit)}</div></div>
          <button class="btn btn-sm" data-act="reqPick" data-name="${esc(i.name)}" data-unit="${esc(i.unit)}">إضافة</button>
        </div>`).join('') || '<div class="hint">لا توجد نتائج.</div>';
    };
    draw('');
    bg.querySelector('#catSearch').addEventListener('input', e => draw(e.target.value.trim()));
  });
};
ACTIONS.reqPick = el => {
  const blank = REQ_LINES.find(l => !l.name);
  if(blank){ blank.name = el.dataset.name; blank.unit = el.dataset.unit; }
  else REQ_LINES.push({id:uid('rl'), name:el.dataset.name, qty:1, unit:el.dataset.unit, spec:''});
  document.getElementById('reqLines').innerHTML = REQ_LINES.map(reqLineRow).join('');
  toast('أُضيف الصنف ✓', 'ok');
};
ACTIONS.closeModal = () => closeModal();

ACTIONS.reqSubmit = form => {
  const f = Object.fromEntries(new FormData(form).entries());
  const lines = REQ_LINES.filter(l => String(l.name).trim());
  if(!lines.length) return toast('أضف صنف واحد على الأقل', 'err');

  const req = {
    id: uid('r'),
    ref: nextRef('request', 'RQ'),
    createdAt: new Date().toISOString(),
    status: 'new',
    client: {name:f.name, org:f.org, phone:f.phone, email:f.email, city:f.city},
    title: f.title || lines[0].name,
    lines: lines.map(l => ({name:l.name, qty:num(l.qty) || 1, unit:l.unit, spec:l.spec})),
    due: f.due, budget: num(f.budget), urgency: f.urgency, notes: f.notes,
    quoteId: ''
  };
  const all = getRequests(); all.unshift(req); saveRequests(all);
  REQ_LINES = [{id:uid('rl'), name:'', qty:1, unit:'حبة', spec:''}];
  document.getElementById('view').innerHTML = viewRequestDone(req);
  window.scrollTo({top:0});
};

function requestText(req){
  const st = getSettings();
  const L = req.lines.map((l, i) => `${i + 1}. ${l.name} — ${l.qty} ${l.unit}${l.spec ? ' (' + l.spec + ')' : ''}`).join('\n');
  return `طلب عرض سعر — ${st.brandAr}
رقم الطلب: ${req.ref}
التاريخ: ${fmtDate(req.createdAt)}

المرسل: ${req.client.name}${req.client.org ? ' — ' + req.client.org : ''}
الجوال: ${req.client.phone}${req.client.email ? '\nالبريد: ' + req.client.email : ''}
المدينة: ${req.client.city || '—'}

الموضوع: ${req.title}
المطلوب:
${L}

التسليم المطلوب: ${req.due ? fmtDate(req.due) : 'غير محدد'}
الاستعجال: ${req.urgency || 'عادي'}${req.budget ? '\nالميزانية التقريبية: ' + money(req.budget) : ''}${req.notes ? '\nملاحظات: ' + req.notes : ''}`;
}

function viewRequestDone(req){
  const st = getSettings();
  const txt = requestText(req);
  const wa = st.phone ? 'https://wa.me/' + String(st.phone).replace(/\D/g, '') + '?text=' + encodeURIComponent(txt) : '';
  const mail = st.email ? 'mailto:' + st.email + '?subject=' + encodeURIComponent('طلب عرض سعر ' + req.ref) + '&body=' + encodeURIComponent(txt) : '';
  return `
  <section class="section" style="border:none">
    <div class="wrap-narrow">
      <div class="panel" style="text-align:center">
        <div style="font-size:42px">✅</div>
        <h3 style="font-size:20px;margin-top:8px">تم استلام طلبك</h3>
        <div class="psub">رقم الطلب <b style="color:var(--gold-2)">${esc(req.ref)}</b> — احتفظ به للمتابعة.</div>
        <div class="btn-row" style="justify-content:center">
          ${wa ? `<a class="btn btn-gold" href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب</a>` : ''}
          ${mail ? `<a class="btn" href="${mail}">إرسال بالبريد</a>` : ''}
          <button class="btn" data-act="copyReq" data-id="${req.id}">نسخ نص الطلب</button>
          <a class="btn btn-ghost" href="#/">الرئيسية</a>
        </div>
        ${(!wa && !mail) ? '<div class="hint">أضف رقم الجوال والبريد من إعدادات مساحة العمل لتفعيل أزرار الإرسال المباشر.</div>' : ''}
      </div>
      <div class="panel">
        <h3>ملخص الطلب</h3>
        <div class="table-wrap">
          <table><thead><tr><th>#</th><th>الصنف</th><th class="num">الكمية</th><th>الوحدة</th><th>المواصفات</th></tr></thead>
          <tbody>${req.lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.name)}</td><td class="num">${fmtInt(l.qty)}</td><td>${esc(l.unit)}</td><td>${esc(l.spec) || '—'}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    </div>
  </section>`;
}
ACTIONS.copyReq = el => {
  const req = getRequests().find(r => r.id === el.dataset.id);
  if(req) copyText(requestText(req));
};

</script>
<script>
/* ==========================================================================
   جسر الحرير — مساحة عمل الوسيط
   الطلبات · بناء عروض الأسعار · قائمة التسوق/الشراء · الأصناف · الإعدادات
   ========================================================================== */

/* ---------- البوابة ---------- */
function viewApp(){
  if(!STATE.unlocked) return viewLock();
  return `
  <section class="section" style="border:none;padding-top:34px">
    <div class="wrap">
      ${kpiRow()}
      <div class="tabs">
        ${tabBtn('inbox','الطلبات')}
        ${tabBtn('quotes','عروض الأسعار')}
        ${tabBtn('buy','قائمة التسوق')}
        ${tabBtn('catalog','الأصناف والموردين')}
        ${tabBtn('settings','الإعدادات')}
      </div>
      <div id="tabBody">${tabBody()}</div>
    </div>
  </section>`;
}
function tabBtn(id, label){
  const n = id === 'inbox' ? getRequests().filter(r => r.status === 'new').length : 0;
  return `<button class="${STATE.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}">${label}${n ? ' <span class="badge b-new" style="margin-inline-start:6px">' + n + '</span>' : ''}</button>`;
}
ACTIONS.tab = el => { STATE.tab = el.dataset.id; STATE.quoteId = null; STATE.poId = null; render(); };

function viewLock(){
  return `
  <div class="lock">
    <div class="panel">
      <div class="lk-ic">🔐</div>
      <h3>مساحة العمل</h3>
      <div class="psub">هذه المساحة خاصة بالوسيط. أدخل رمز الدخول.</div>
      <form data-submit="unlock">
        <div class="field"><input class="inp" name="code" type="password" placeholder="رمز الدخول" autofocus style="text-align:center;letter-spacing:6px"></div>
        <button class="btn btn-gold" style="width:100%">دخول</button>
      </form>
      <div class="hint">الرمز الافتراضي 1234 — غيّره من الإعدادات بعد الدخول.</div>
    </div>
  </div>`;
}
ACTIONS.unlock = form => {
  const code = new FormData(form).get('code');
  if(String(code) === String(getSettings().passcode)){ STATE.unlocked = true; render(); }
  else toast('رمز غير صحيح', 'err');
};

/* ---------- مؤشرات سريعة ---------- */
function kpiRow(){
  const reqs = getRequests(), quotes = getQuotes();
  const newReqs = reqs.filter(r => r.status === 'new').length;
  const open = quotes.filter(q => q.status === 'draft' || q.status === 'sent');
  const openVal = open.reduce((s, q) => s + calcQuote(q).total, 0);
  const won = quotes.filter(q => q.status === 'won');
  const profit = won.reduce((s, q) => s + calcQuote(q).profit, 0);
  return `<div class="kpis">
    <div class="kpi"><div class="l">طلبات جديدة</div><div class="n">${newReqs}</div></div>
    <div class="kpi"><div class="l">عروض مفتوحة</div><div class="n">${open.length}</div></div>
    <div class="kpi"><div class="l">قيمة العروض المفتوحة</div><div class="n gold">${money(openVal)}</div></div>
    <div class="kpi"><div class="l">أرباح العروض المعتمدة</div><div class="n green">${money(profit)}</div></div>
  </div>`;
}

function tabBody(){
  if(STATE.tab === 'quotes')   return STATE.quoteId ? quoteEditor() : quotesList();
  if(STATE.tab === 'buy')      return STATE.poId ? poEditor() : poList();
  if(STATE.tab === 'catalog')  return catalogTab();
  if(STATE.tab === 'settings') return settingsTab();
  return inboxTab();
}
function repaint(){ const b = document.getElementById('tabBody'); if(b) b.innerHTML = tabBody(); }
function afterApp(){}

/* ==========================================================================
   ١) الطلبات
   ========================================================================== */
function inboxTab(){
  const all = getRequests();
  const f = STATE.reqFilter;
  const q = STATE.q.trim();
  let list = f === 'all' ? all : all.filter(r => r.status === f);
  if(q) list = list.filter(r => (r.ref + ' ' + r.title + ' ' + r.client.name + ' ' + (r.client.org || '')).includes(q));

  const chips = ['all'].concat(Object.keys(REQ_STATUS)).map(k => {
    const label = k === 'all' ? 'الكل' : REQ_STATUS[k].label;
    const n = k === 'all' ? all.length : all.filter(r => r.status === k).length;
    return `<button class="btn btn-sm ${STATE.reqFilter === k ? 'btn-gold' : 'btn-ghost'}" data-act="reqFilter" data-id="${k}">${label} (${n})</button>`;
  }).join('');

  const rows = list.map(r => `
    <div class="list-item">
      <div class="li-main">
        <div class="li-t">${esc(r.title)} <span class="badge ${REQ_STATUS[r.status].cls}">${REQ_STATUS[r.status].label}</span></div>
        <div class="li-s">${esc(r.ref)} · ${esc(r.client.name)}${r.client.org ? ' — ' + esc(r.client.org) : ''} · ${esc(r.client.phone || '')} · ${r.lines.length} بند · ${fmtDate(r.createdAt)}${r.due ? ' · التسليم ' + fmtDate(r.due) : ''}</div>
      </div>
      ${r.budget ? `<div class="li-n">${money(r.budget)}</div>` : ''}
      <div class="btn-row">
        <button class="btn btn-sm" data-act="reqView" data-id="${r.id}">تفاصيل</button>
        <button class="btn btn-sm btn-gold" data-act="reqToQuote" data-id="${r.id}">${r.quoteId ? 'فتح العرض' : 'حوّل لعرض سعر'}</button>
        <select class="inp btn-sm" style="width:130px;padding:6px 8px" data-change="reqStatus" data-id="${r.id}">
          ${Object.keys(REQ_STATUS).map(k => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${REQ_STATUS[k].label}</option>`).join('')}
        </select>
        <button class="btn btn-sm btn-danger" data-act="reqRemove" data-id="${r.id}">✕</button>
      </div>
    </div>`).join('');

  return `
  <div class="panel">
    <div class="panel-head">
      <h3>الطلبات الواردة</h3>
      <div class="spacer"></div>
      <input class="inp" style="width:200px" placeholder="بحث…" value="${esc(STATE.q)}" data-input="reqSearch">
      <a class="btn btn-sm" href="#/request">+ تسجيل طلب يدوي</a>
    </div>
    <div class="btn-row" style="margin-bottom:18px">${chips}</div>
    ${rows || `<div class="empty"><div class="e-ic">📥</div>لا توجد طلبات ${f === 'all' ? 'بعد' : 'بهذه الحالة'}.<br><span class="hint">أي طلب يُرسل من نموذج الموقع يظهر هنا مباشرة.</span></div>`}
  </div>`;
}
ACTIONS.reqFilter = el => { STATE.reqFilter = el.dataset.id; repaint(); };
ACTIONS.reqSearch = el => { STATE.q = el.value; const b = document.getElementById('tabBody'); const pos = el.selectionStart; b.innerHTML = tabBody(); const n = b.querySelector('[data-input="reqSearch"]'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } };
ACTIONS.reqStatus = el => {
  const all = getRequests(); const r = all.find(x => x.id === el.dataset.id);
  if(r){ r.status = el.value; saveRequests(all); repaint(); toast('تم تحديث الحالة ✓', 'ok'); }
};
ACTIONS.reqRemove = el => {
  if(!confirm('حذف الطلب نهائياً؟')) return;
  saveRequests(getRequests().filter(r => r.id !== el.dataset.id));
  repaint(); toast('تم الحذف', 'ok');
};
ACTIONS.reqView = el => {
  const r = getRequests().find(x => x.id === el.dataset.id);
  if(!r) return;
  modal('الطلب ' + r.ref, `
    <div class="row r2">
      <div><div class="hint">العميل</div><b>${esc(r.client.name)}</b><div class="hint">${esc(r.client.org || '')}</div></div>

/* تحويل الطلب إلى عرض سعر مع تعبئة التكاليف من الكتالوج */
ACTIONS.reqToQuote = el => {
  closeModal();
  const reqs = getRequests(); const r = reqs.find(x => x.id === el.dataset.id);
  if(!r) return;
  const quotes = getQuotes();
  if(r.quoteId && quotes.some(q => q.id === r.quoteId)){
    STATE.tab = 'quotes'; STATE.quoteId = r.quoteId; render(); return;
  }
  const items = getItems();
  const q = emptyQuote();
  q.ref = nextRef('quote', 'QT');
  q.requestId = r.id;
  q.client = Object.assign({}, r.client);
  q.title = r.title;
  q.lines = r.lines.map(l => {
    const it = items.find(i => i.name === l.name);
    return {
      id: uid('l'), name: l.name, spec: l.spec || '',
      qty: num(l.qty) || 1, unit: l.unit || (it ? it.unit : 'حبة'),
      cost: it ? it.cost : 0, margin: it ? it.margin : getSettings().defaultMargin,
      supplier: it ? it.supplier : ''
    };
  });
  quotes.unshift(q); saveQuotes(quotes);
  r.quoteId = q.id; r.status = 'pricing'; saveRequests(reqs);
  STATE.tab = 'quotes'; STATE.quoteId = q.id; render();
  toast('تم إنشاء العرض ' + q.ref + ' — عبّي التكاليف ✓', 'ok');
};

function curQuote(){ return getQuotes().find(q => q.id === STATE.quoteId); }
function saveQuote(q){
  const all = getQuotes(); const i = all.findIndex(x => x.id === q.id);

}

/* تعديلات حيّة بدون إعادة رسم كامل */
function liveRefresh(q){
  const c = calcQuote(q);
  const box = document.getElementById('qTotals');
  if(box) box.innerHTML = totalsBox(c);
  c.lines.forEach(l => {
    const tr = document.querySelector('[data-ql="' + l.id + '"]');
    if(!tr) return;
    tr.querySelector('[data-cell="unit"]').textContent = money(l.unitPrice, false);
    tr.querySelector('[data-cell="total"]').textContent = money(l.lineTotal, false);
  });
}
ACTIONS.qLine = el => {
  const q = curQuote(); if(!q) return;
  const id = el.closest('[data-ql]').dataset.ql;
  const l = q.lines.find(x => x.id === id); if(!l) return;
  const f = el.dataset.f;
  l[f] = (f === 'qty' || f === 'cost' || f === 'margin') ? num(el.value) : el.value;
  saveQuote(q); liveRefresh(q);
};
ACTIONS.qField = el => {
  const q = curQuote(); if(!q) return;
  const f = el.dataset.f;
  if(f === 'vat') q.vat = el.value === '1';
  else if(['feeValue','delivery','discValue','validity'].includes(f)) q[f] = num(el.value);
  else q[f] = el.value;
  saveQuote(q);
  if(f === 'status' || f === 'date' || f === 'validity'){ repaint(); }
  else liveRefresh(q);
};
ACTIONS.qClient = el => {
  const q = curQuote(); if(!q) return;
  q.client[el.dataset.f] = el.value; saveQuote(q);
};
ACTIONS.qLineAdd = () => {
  const q = curQuote(); q.lines.push(emptyLine()); saveQuote(q); repaint();
};
ACTIONS.qLineDel = el => {
  const q = curQuote(); q.lines = q.lines.filter(l => l.id !== el.dataset.id); saveQuote(q); repaint();
};

    .concat(c.lines.map(l => [l.name, l.spec, l.qty, l.unit, l.cost, l.margin, l.unitPrice, l.lineTotal, l.supplier]));

ACTIONS.qToPO = el => {
  const q = getQuotes().find(x => x.id === el.dataset.id); if(!q) return;
  const pos = getPOs();
  const exist = pos.find(p => p.quoteId === q.id);
  if(exist){ STATE.tab = 'buy'; STATE.poId = exist.id; render(); return toast('القائمة موجودة مسبقاً'); }
  const c = calcQuote(q);
  const po = {
    id: uid('p'), ref: nextRef('po', 'PO'), createdAt: new Date().toISOString(),
    quoteId: q.id, title: q.title || q.ref, client: q.client.name || '',
    revenue: c.subtotal,
    lines: c.lines.map(l => ({
      id: uid('pl'), name:l.name, spec:l.spec, qty:l.qty, unit:l.unit,
      supplier:l.supplier || '', est:r2(l.lineCost), actual:0, status:'todo', note:''
    })),
    notes: ''
  };
  pos.unshift(po); savePOs(pos);
  STATE.tab = 'buy'; STATE.poId = po.id; render();
  toast('تم إنشاء قائمة الشراء ' + po.ref + ' ✓', 'ok');
};

function poCalc(p){
  const est = r2((p.lines || []).reduce((s, l) => s + num(l.est), 0));
  const actual = r2((p.lines || []).reduce((s, l) => s + (num(l.actual) || 0), 0));
  const spent = r2((p.lines || []).reduce((s, l) => s + (num(l.actual) || num(l.est)), 0));
  const done = (p.lines || []).filter(l => l.status === 'received').length;
  const diff = r2(est - actual);
  const profit = p.revenue ? r2(num(p.revenue) - spent) : null;
  return {est, actual, spent, diff, done, count:(p.lines || []).length, profit};
}

      <div class="row r4">
        <div class="field"><label>اسم المسؤول</label><input class="inp" name="owner" value="${esc(s.owner)}"></div>
        <div class="field"><label>الجوال / واتساب</label><input class="inp" name="phone" value="${esc(s.phone)}" placeholder="9665xxxxxxxx"></div>
        <div class="field"><label>البريد</label><input class="inp" name="email" value="${esc(s.email)}"></div>
        <div class="field"><label>المدينة</label><input class="inp" name="city" value="${esc(s.city)}"></div>
      </div>
      <div class="row r2">
        <div class="field"><label>الرقم الضريبي</label><input class="inp" name="vatNo" value="${esc(s.vatNo)}"></div>
        <div class="field"><label>السجل التجاري</label><input class="inp" name="crNo" value="${esc(s.crNo)}"></div>
      </div>
    </div>

    <div class="panel">
      <h3>قواعد التسعير</h3>
      <div class="psub">القيم الافتراضية لأي عرض جديد.</div>
      <div class="row r4">
        <div class="field"><label>ضريبة القيمة المضافة %</label><input class="inp" name="vatRate" type="number" min="0" step="0.5" value="${esc(s.vatRate)}"></div>
        <div class="field"><label>هامش الوساطة الافتراضي %</label><input class="inp" name="defaultMargin" type="number" min="0" step="1" value="${esc(s.defaultMargin)}"></div>
        <div class="field"><label>نوع رسوم الخدمة</label>
          <select class="inp" name="serviceFeeType">
            <option value="pct" ${s.serviceFeeType === 'pct' ? 'selected' : ''}>نسبة %</option>
            <option value="fixed" ${s.serviceFeeType === 'fixed' ? 'selected' : ''}>مبلغ ثابت</option>
          </select></div>
        <div class="field"><label>قيمة رسوم الخدمة</label><input class="inp" name="serviceFeeValue" type="number" min="0" step="0.01" value="${esc(s.serviceFeeValue)}"></div>
      </div>
      <div class="row r2">
        <div class="field"><label>صلاحية العرض (يوم)</label><input class="inp" name="validityDays" type="number" min="1" value="${esc(s.validityDays)}"></div>
        <div class="field"><label>رمز الدخول لمساحة العمل</label><input class="inp" name="passcode" value="${esc(s.passcode)}"></div>
      </div>
      <div class="field"><label>الشروط والأحكام الافتراضية</label><textarea class="inp" name="terms" style="min-height:150px">${esc(s.terms)}</textarea></div>
      <div class="btn-row"><button class="btn btn-gold" type="submit">حفظ الإعدادات</button></div>
    </div>
  </form>

  <div class="panel">
    <h3>النسخ الاحتياطي</h3>
    <div class="psub">البيانات محفوظة في هذا المتصفح فقط. نزّل نسخة بشكل دوري، خصوصاً قبل تغيير الجهاز أو مسح بيانات المتصفح.</div>
    <div class="btn-row">
      <button class="btn btn-gold" data-act="backupOut">تنزيل نسخة احتياطية</button>
      <button class="btn" data-act="backupIn">استرجاع من ملف</button>
      <button class="btn btn-danger" data-act="wipe">مسح كل البيانات</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
  </div>`;
}
ACTIONS.setSave = form => {
  const f = Object.fromEntries(new FormData(form).entries());
  const s = getSettings();
  ['brandAr','brandEn','tagline','owner','phone','email','city','vatNo','crNo','serviceFeeType','passcode','terms'].forEach(k => s[k] = f[k]);
  ['vatRate','defaultMargin','serviceFeeValue','validityDays'].forEach(k => s[k] = num(f[k]));
  saveSettings(s); brandUp(); render();
  toast('تم حفظ الإعدادات ✓', 'ok');
};
ACTIONS.backupOut = () => {
  downloadFile('silk-bridge-backup-' + today() + '.json', JSON.stringify(exportAll(), null, 2));
  toast('تم تنزيل النسخة ✓', 'ok');
};
ACTIONS.backupIn = () => {
  const inp = document.getElementById('fileIn');
  inp.onchange = () => {
    const file = inp.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{ importAll(JSON.parse(rd.result)); brandUp(); render(); toast('تم الاسترجاع ✓', 'ok'); }
      catch(e){ toast('الملف غير صالح: ' + e.message, 'err'); }
    };
    rd.readAsText(file);
  };
  inp.click();
};
ACTIONS.wipe = () => {
  if(!confirm('سيتم مسح كل الطلبات والعروض والأصناف. متأكد؟')) return;
  if(!confirm('تأكيد أخير — هل نزّلت نسخة احتياطية؟')) return;
  ['settings','items','suppliers','requests','quotes','pos'].forEach(k => DB.drop(k));
  STATE.tab = 'inbox'; STATE.quoteId = null; STATE.poId = null;
  brandUp(); render(); toast('تم المسح', 'ok');
};

</script>
</body>
</html>
